<!doctype html>
<!-- Neutral "nothing happening" screen used as a scenario baseline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family photos</title>
<style>
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #fafafa; color: #333; }
  header { padding: 18px 32px; font-size: 22px; border-bottom: 1px solid #ddd; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 32px; }
  .ph { height: 180px; border-radius: 8px; }
</style>
</head>
<body>
  <header>Photos &mdash; Grandkids, summer</header>
  <div class="grid">
    <div class="ph" style="background:#9cc5a1"></div><div class="ph" style="background:#f2c57c"></div>
    <div class="ph" style="background:#a3c4f3"></div><div class="ph" style="background:#e9a6a6"></div>
    <div class="ph" style="background:#c9b6e4"></div><div class="ph" style="background:#f6e27f"></div>
    <div class="ph" style="background:#8fd3c8"></div><div class="ph" style="background:#f4b6c2"></div>
  </div>
</body>
</html>
