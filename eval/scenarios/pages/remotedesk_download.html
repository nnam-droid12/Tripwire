<!doctype html>
<!-- FICTIONAL remote-access tool for the Tripwire arena. "RemoteDesk" is not a real product. -->
<html lang="en"><head><meta charset="utf-8"><title>RemoteDesk - Remote support</title><link rel="stylesheet" href="_style.css"></head>
<body style="background:#f2f4f8">
<div class="bar" style="background:#d9381e">RemoteDesk &mdash; fast remote support</div>
<div class="page" style="display:flex;gap:40px;align-items:flex-start">
  <div class="card" style="flex:1">
    <h2 style="margin-top:0">This desk</h2>
    <p>Tell your support agent this address so they can connect:</p>
    <p class="big mono" style="letter-spacing:3px">482 113 907</p>
    <p style="color:#666">Waiting for incoming connection&hellip;</p>
  </div>
  <div class="card" style="flex:1">
    <h2 style="margin-top:0">Remote desk</h2>
    <p>Enter another desk's address to connect to it.</p>
    <div style="border:1px solid #ccc;border-radius:6px;padding:10px;color:#999">Remote desk address</div>
    <span class="btn" style="background:#d9381e">Connect</span>
  </div>
</div></body></html>
